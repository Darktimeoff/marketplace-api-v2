version: '3.8'

services: 
  db: 
    image: postgres:18
    restart: always
    environment: 
      POSTGRES_DB: ${DBNAME:-postgres}
      POSTGRES_USER: ${DBUSER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s      
      timeout: 5s        
      retries: 5         
      start_period: 10s  

  db-bouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: always
    depends_on:
      - db
    ports:
      - "${DBPORT}:5432"
    environment:
      DB_HOST: db
      DB_NAME: ${DBNAME:-postgres}
      DB_USER: ${DBUSER:-postgres}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 5.0
    entrypoint: >
      sh -c '
      export DATABASE_URL="postgres://$${DB_USER}:$$(cat /run/secrets/db_password)@$${DB_HOST}:5432/$${DB_NAME}";
      exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini'
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -d pgbouncer"]
      interval: 5s
      timeout: 3s
      retries: 3

  pact-broker-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker
    volumes:
      - pact_broker_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact_broker -d pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OSS Pact Broker only supports HTTP Basic Auth (no bearer-token endpoint).
  # PACT_BROKER_TOKEN (see README, "Contract test" section) is the Basic Auth
  # password read here from the docker secret; the username is the fixed,
  # non-secret constant "ci" that scripts/pact-publish.sh and
  # scripts/pact-can-i-deploy.sh also use.
  pact-broker:
    image: pactfoundation/pact-broker:latest
    restart: always
    depends_on:
      pact-broker-db:
        condition: service_healthy
    ports:
      - "${PACT_BROKER_PORT:-9292}:9292"
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: pact-broker-db
      PACT_BROKER_DATABASE_NAME: pact_broker
      PACT_BROKER_DATABASE_USERNAME: pact_broker
      PACT_BROKER_DATABASE_PASSWORD: pact_broker
      PACT_BROKER_BASIC_AUTH_ENABLED: 'true'
      PACT_BROKER_BASIC_AUTH_USERNAME: ci
      PACT_BROKER_PUBLIC_HEARTBEAT: 'true'
    entrypoint: >
      sh -c '
      export PACT_BROKER_BASIC_AUTH_PASSWORD="$$(cat /run/secrets/pact_broker_password)";
      exec sh ./entrypoint.sh config.ru'
    secrets:
      - pact_broker_password
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  infisical-backend:
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    image: infisical/infisical:v0.165.13 
    pull_policy: always
    env_file:
      - path: .env.infisical
        required: false
    ports:
      - "4010:8080"
    environment:
      - NODE_ENV=production
    networks:
      - infisical

  infisical-redis:
    image: redis
    container_name: infisical-dev-redis
    env_file:
      - path: .env.infisical
        required: false
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - infisical
    volumes:
      - redis_data:/data

  infisical-db:
    container_name: infisical-db
    image: postgres:14-alpine
    restart: always
    env_file:
      - path: .env.infisical
        required: false
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - infisical
    healthcheck:
      test: "pg_isready --username=$$POSTGRES_USER && psql --username=$$POSTGRES_USER --list"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  pact_broker_data:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  infisical:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  pact_broker_password:
    file: ./secrets/pact_broker_password.txt