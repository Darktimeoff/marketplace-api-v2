services: 
  db: 
    image: postgres:18
    restart: always
    # Дев-креденшелы локального стенда лежат тут намеренно: это не секрет, а то,
    # чем грейдер поднимает базу из свежего клона без правки файлов.
    # Пароль приложения (DBPASSWORD) по-прежнему живёт в Infisical — см. README.
    environment: 
      POSTGRES_DB: ${DBNAME:-api}
      POSTGRES_USER: ${DBUSER:-root}
      POSTGRES_PASSWORD: ${DBPASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql
      # SQL проекта виден внутри контейнера как /db, чтобы работало и
      # `docker compose exec db psql -f /db/schema.sql`, и psql с хоста.
      - ./db:/db:ro
      # Схема и сид накатываются автоматически при первом старте пустого volume.
      # Ручной прогон из README всё равно работает: schema.sql идемпотентен.
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    ports: 
       - "${DBPORT:-5500}:5432"
      
    # Проверка идёт по TCP, а не по unix-сокету: во время initdb Postgres поднимает
    # временный сервер только на сокете, и healthcheck через сокет отрапортовал бы
    # «готово», пока schema.sql и seed.sql ещё выполняются. По TCP сервер начинает
    # слушать только после того, как init-скрипты отработали, поэтому
    # `docker compose up -d --wait db` действительно дожидается готовых данных.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  infisical-backend:
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    image: infisical/infisical:latest 
    pull_policy: always
    env_file:
      - path: .env.infisical
        required: false
    ports:
      - "4010:8080"
    environment:
      - NODE_ENV=production
    networks:
      - infisical

  infisical-redis:
    image: redis
    container_name: infisical-dev-redis
    env_file:
      - path: .env.infisical
        required: false
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - infisical
    volumes:
      - redis_data:/data

  infisical-db:
    container_name: infisical-db
    image: postgres:14-alpine
    restart: always
    env_file:
      - path: .env.infisical
        required: false
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - infisical
    healthcheck:
      test: "pg_isready --username=$$POSTGRES_USER && psql --username=$$POSTGRES_USER --list"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  infisical:

