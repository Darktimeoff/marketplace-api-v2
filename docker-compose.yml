version: '3.8'

services: 
  db: 
    image: postgres:18
    restart: always
    environment: 
      POSTGRES_DB: ${DBNAME:-postgres}
      POSTGRES_USER: ${DBUSER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db:/db:ro
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    ports: 
       - "${DBPORT}:5432"
    secrets:
      - db_password
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s      
      timeout: 5s        
      retries: 5         
      start_period: 10s  

  infisical-backend:
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    image: infisical/infisical:latest 
    pull_policy: always
    env_file:
      - path: .env.infisical
        required: false
    ports:
      - "4010:8080"
    environment:
      - NODE_ENV=production
    networks:
      - infisical

  infisical-redis:
    image: redis
    container_name: infisical-dev-redis
    env_file:
      - path: .env.infisical
        required: false
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - infisical
    volumes:
      - redis_data:/data

  infisical-db:
    container_name: infisical-db
    image: postgres:14-alpine
    restart: always
    env_file:
      - path: .env.infisical
        required: false
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - infisical
    healthcheck:
      test: "pg_isready --username=$$POSTGRES_USER && psql --username=$$POSTGRES_USER --list"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  infisical:

secrets:
  db_password:
    file: ./secrets/db_password.txt