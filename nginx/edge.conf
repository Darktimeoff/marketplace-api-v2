proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:10m max_size=512m inactive=30d use_temp_path=off;

server {
    listen 80;

    location = /healthz {
        access_log off;
        return 200;
    }

    location ~ ^/(media|assets)/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://host.docker.internal:8787;
        proxy_http_version 1.1;
        proxy_cache edge;
        proxy_cache_key $uri;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status always;
    }

    location / {
        return 404;
    }
}
